version: "3.8"

# Research stack — runs research_app.py (port 5001) alongside the
# production stack (docker-compose.yml, port 5000).
#
# Usage:
#   # Start production stack first (creates tutorial-network):
#   docker-compose up -d
#
#   # Then start research stack:
#   docker-compose -f docker-compose-v2.yml up -d
#
# The two stacks share:
#   - tutorial-network  (so Prometheus can scrape both)
#   - ./output volume   (so tutorials generated by either app are visible in both)

services:
  pocketflow-research:
    build:
      context: .
      dockerfile: Dockerfile.research   # see below — copies call_tree.py to utils/
    container_name: code-tutorial-generator-research
    ports:
      - "5001:5001"
    volumes:
      - ./output:/app/output
      - ./uploads:/app/uploads
      - ./research_results:/app/research_results
      - ./profiling_reports:/app/profiling_reports
    env_file:
      - .env
    environment:
      FLASK_ENV:        production
      FLASK_DEBUG:      "0"
      PYTHONUNBUFFERED: "1"
      APP_VERSION:      research
      APP_MODE:         async
    restart: unless-stopped
    command: ["python", "research_app.py"]   # ← explicit — never falls back to app.py
    networks:
      - tutorial-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  tutorial-network:
    external: true
    name: pocketflow-tutorial-codebase-knowledge-main_tutorial-network
 